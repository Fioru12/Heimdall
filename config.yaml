# Heimdall HIDS & Active Response Configuration

server:
  host: "127.0.0.1"
  port: 8000
  reload: true

database:
  path: "heimdall.db"

rules:
  directory: "rules"

responder:
  dry_run: true
  allowed_os: ["Linux", "Windows"]
  # Optional: automatically expire IP blocks after N hours (null = permanent
  # block until manually/`unblock-expired` removed). Prevents a false
  # positive from turning into a permanent self-DoS.
  block_ttl_hours: null

# File Integrity Monitoring (FIM lite, core/fim.py). Disabilitato di default:
# impostare paths esplicite, creare la baseline una volta, poi `fim-scan`
# (anche via cron) per rilevare NEW/MODIFIED/DELETED.
fim:
  enabled: false
  paths: []
  baseline: "fim_baseline.json"
  exclude: ["*.tmp", "*.log"]

# Telegram notifications (optional)
# To enable:
# 1. Create a bot via @BotFather on Telegram
# 2. Get your chat ID via @userinfobot
# 3. Fill in the values below
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
